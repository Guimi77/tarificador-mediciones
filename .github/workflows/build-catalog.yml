name: Build plain catalog CSV

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'catalog-data-*.js'
      - '.github/workflows/build-catalog.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Rebuild catalog.csv
        shell: bash
        run: |
          python - <<'PY'
          import re, base64, gzip, csv, glob
          parts=[]
          for path in sorted(glob.glob('catalog-data-*.js')):
              text=open(path,encoding='utf-8').read()
              m=re.search(r"push\('([^']*)'\)", text, re.S)
              if not m:
                  raise SystemExit(f'No base64 payload in {path}')
              parts.append(m.group(1))
          payload=''.join(parts)
          raw=gzip.decompress(base64.b64decode(payload, validate=True))
          open('catalog.csv','wb').write(raw)
          with open('catalog.csv',encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==1126, f'Expected 1126 products, got {len(rows)}'
          refs={r['Referencia interna'].strip():r for r in rows}
          checks={
            'BUCMONO MONOBUC CPMMONO 482021':165.0,
            'PLS':68.2,
            'PIQUETA':59.65,
          }
          for ref,price in checks.items():
              row=refs.get(ref)
              assert row, f'Missing {ref}'
              assert abs(float(row['Precio de venta'])-price)<0.001, f'Bad price for {ref}'
          assert any(r['Referencia interna'].strip().startswith("A3X1'5") and abs(float(r['Precio de venta'])-4.0)<0.001 for r in rows), "Missing A3X1'5"
          print('Verified 1126 products and key references')
          PY
      - name: Commit catalog.csv
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.csv
          if git diff --cached --quiet; then
            echo 'catalog.csv already up to date'
          else
            git commit -m 'data: rebuild plain Odoo catalog CSV'
            git push origin HEAD:develop
          fi
