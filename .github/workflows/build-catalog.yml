name: Build plain catalog CSV

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'catalog-data-*.js'
      - '.github/workflows/build-catalog.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Rebuild and verify catalog.csv
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, csv, glob, re

          parts=[]
          for path in sorted(glob.glob('catalog-data-*.js')):
              text=open(path,encoding='utf-8').read()
              marker="push('"
              if marker not in text:
                  raise SystemExit(f'No payload marker in {path}')
              payload=text.split(marker,1)[1]
              # Some old chunks were saved without the closing JS characters.
              # Base64 itself only uses A-Z a-z 0-9 + / =, so keep only those.
              payload=''.join(re.findall(r'[A-Za-z0-9+/=]+', payload))
              parts.append(payload)
              print(path, len(payload))

          encoded=''.join(parts)
          raw=gzip.decompress(base64.b64decode(encoded, validate=True))
          open('catalog.csv','wb').write(raw)

          with open('catalog.csv',encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))

          assert len(rows)==1126, f'Expected 1126 products, got {len(rows)}'
          refs={r['Referencia interna'].strip():r for r in rows}
          checks={
            'BUCMONO MONOBUC CPMMONO 482021':165.0,
            'PLS':68.2,
            'PIQUETA':59.65,
          }
          for ref,price in checks.items():
              row=refs.get(ref)
              assert row, f'Missing {ref}'
              assert abs(float(row['Precio de venta'])-price)<0.001, f'Bad price for {ref}: {row["Precio de venta"]}'

          a3=next((r for r in rows if r['Referencia interna'].strip().startswith("A3X1'5")),None)
          assert a3, "Missing A3X1'5"
          assert abs(float(a3['Precio de venta'])-4.0)<0.001, f'Bad price for A3X1\'5: {a3["Precio de venta"]}'

          print('VERIFIED: 1126 products; BUCMONO, PLS, PIQUETA and A3X1\'5 OK')
          PY

      - name: Commit catalog.csv
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.csv
          if git diff --cached --quiet; then
            echo 'catalog.csv already up to date'
          else
            git commit -m 'data: rebuild verified Odoo catalog CSV'
            git push origin HEAD:develop
          fi
